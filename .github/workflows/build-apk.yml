name: Build APK

on:
  # Uruchamia workflow automatycznie dla zmian na głównych gałęziach.
  push:
    branches: [ "main", "master" ]
  # Sprawdza każdą propozycję zmian przed scaleniem.
  pull_request:
    branches: [ "main", "master" ]
  # Umożliwia ręczne uruchomienie z poziomu GitHub Actions.
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Opublikuj debug APK jako trwały techniczny prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Tag wydania, np. mobile-videdit-v1.0-rc1; wymagany przy publikacji"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Pobiera kod źródłowy repozytorium do środowiska CI.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Konfiguruje JDK wymagane do budowania projektu Android.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Odtwarza brakujący plik gradle-wrapper.jar z oficjalnego wydania Gradle,
      # dzięki czemu build działa nawet gdy repo nie przechowuje plików binarnych.
      - name: Restore Gradle wrapper JAR
        run: |
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          if [ -z "$GRADLE_VERSION" ]; then
            echo "Nie udało się odczytać wersji Gradle z gradle-wrapper.properties" >&2
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      # Nadaje uprawnienia wykonywania wrapperowi Gradle.
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # Buduje wariant debug APK, który nie wymaga podpisywania kluczem produkcyjnym.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Publikuje wygenerowany APK jako artefakt do pobrania z joba.
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-prerelease:
    name: Publish technical prerelease
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          test -n "${{ inputs.release_tag }}" || {
            echo "::error::release_tag is required when publish_prerelease=true"
            exit 2
          }

      - name: Download APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release
          sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "Mobile Video Editor technical prerelease"
          prerelease: true
          body: |
            Technical debug snapshot of the current repository state.
            This release is intended for reproducible evaluation and testing, not production distribution.
          files: |
            release/app-debug.apk
            release/SHA256SUMS.txt

      - name: Delete transient Actions artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
